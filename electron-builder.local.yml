# Local, unsigned Windows build.
#
# The official release signs the installer with Azure Trusted Signing. A local
# build has no such account, so the signing step is switched off here; the
# installer is then unsigned, which Windows marks as an unverified publisher.
#
# Usage: yarn electron-builder --win --x64 --publish never \
#          --prepackaged out/Zettlr-win32-x64 --config electron-builder.local.yml
extends: ./electron-builder.yml
win:
  azureSignOptions: null
